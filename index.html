<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Da Vinci’s Notebook</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=EB+Garamond:wght@400;500;600&family=IM+Fell+English:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js" defer></script>
  <script src="js/app.js" type="module"></script>
</head>
<body>
  <header class="app-header">
    <div>
      <h1 class="brand">Da Vinci’s Notebook</h1>
      <p class="tagline">Draw it. It works.</p>
    </div>
    <button id="settings-open" class="btn btn-ghost" type="button" aria-haspopup="dialog" aria-controls="settings-modal">Settings</button>
  </header>

  <nav class="folio-tabs" role="tablist" aria-label="Notebook folios">
    <button id="tab-draw" class="folio-tab is-active" type="button" role="tab" aria-controls="screen-draw" aria-selected="true" tabindex="0">I · Draw</button>
    <button id="tab-interpret" class="folio-tab" type="button" role="tab" aria-controls="screen-interpret" aria-selected="false" tabindex="-1">II · Interpret</button>
    <button id="tab-live" class="folio-tab" type="button" role="tab" aria-controls="screen-live" aria-selected="false" tabindex="-1">III · Breathe life</button>
    <button id="tab-gallery" class="folio-tab" type="button" role="tab" aria-controls="screen-gallery" aria-selected="false" tabindex="-1">Leonardo’s Gallery</button>
  </nav>

  <main>
    <section id="screen-draw" class="screen is-active" role="tabpanel" aria-labelledby="tab-draw" tabindex="0">
      <h2>Draw</h2>
      <div id="drawing-area" class="stage paper">
        <canvas id="draw-canvas" class="draw-pad" width="1000" height="625" aria-label="Sketch canvas">Your sketch will appear here.</canvas>
      </div>
      <div class="pad-tools" role="group" aria-label="Sketch tools">
        <button id="draw-undo" class="btn btn-ghost" type="button">Undo</button>
        <button id="draw-clear" class="btn btn-ghost" type="button">Clear</button>
        <button id="draw-sample" class="btn sample-btn" type="button">Try a sample sketch</button>
        <button id="draw-upload" class="btn" type="button">Upload</button>
        <button id="draw-camera" class="btn" type="button" aria-controls="camera-preview">Camera</button>
        <button id="draw-interpret" class="btn btn-primary" type="button">Interpret</button>
        <input id="sketch-upload" type="file" accept="image/*" aria-label="Upload a sketch image" hidden>
      </div>
      <section id="camera-preview" class="paper" aria-label="Camera preview" hidden>
        <video id="camera-video" width="640" autoplay muted playsinline aria-label="Live camera preview"></video>
        <p id="camera-status" role="status">Waiting for the camera…</p>
        <div class="controls">
          <button id="camera-capture" class="btn btn-primary" type="button" disabled>Capture</button>
          <button id="camera-cancel" class="btn btn-ghost" type="button">Cancel</button>
        </div>
      </section>
    </section>

    <section id="screen-interpret" class="screen" role="tabpanel" aria-labelledby="tab-interpret" tabindex="0" hidden>
      <h2>Interpret</h2>
      <div class="stage paper">
        <canvas id="interpret-canvas" width="1000" height="625" aria-label="Interpreted sketch canvas">Your interpreted sketch will appear here.</canvas>
      </div>
      <aside class="side-panel" aria-label="Sketch parts">
        <div id="parts-list" class="parts-list"></div>
        <button id="interpret-reread" class="btn" type="button" data-unfinished>Re-read sketch</button>
        <button id="interpret-live" class="btn btn-primary" type="button" data-unfinished>Breathe life</button>
      </aside>
    </section>

    <section id="screen-live" class="screen" role="tabpanel" aria-labelledby="tab-live" tabindex="0" hidden>
      <h2>Breathe life</h2>
      <div class="stage paper" role="group" aria-label="Simulation canvas">
        <canvas id="sim-canvas" width="1000" height="625"></canvas>
      </div>
      <div class="controls" role="group" aria-label="Simulation controls">
        <button id="sim-play-pause" class="btn btn-primary" type="button" data-unfinished>Play/Pause</button>
        <button id="sim-reset" class="btn" type="button" data-unfinished>Reset</button>
        <label for="sim-gravity">Gravity</label>
        <input id="sim-gravity" class="slider" type="range" min="0" max="2" step="0.1" value="1">
        <label for="sim-time-scale">Slow motion / time scale</label>
        <input id="sim-time-scale" class="slider" type="range" min="0.1" max="1" step="0.1" value="1">
        <label for="sim-show-sketch"><input id="sim-show-sketch" type="checkbox"> Show sketch</label>
      </div>
      <div class="stats" role="group" aria-label="Simulation statistics">
        <div class="stat"><span class="stat-label">Distance</span> <span id="stat-distance" class="stat-value">—</span> m</div>
        <div class="stat"><span class="stat-label">Peak height</span> <span id="stat-peak" class="stat-value">—</span> m</div>
        <div class="stat"><span class="stat-label">Top speed</span> <span id="stat-top-speed" class="stat-value">—</span> m/s</div>
      </div>
      <button id="ask-leonardo" class="btn" type="button" data-unfinished>Ask Leonardo</button>
      <aside id="leonardo-note" class="margin-note" aria-label="Leonardo’s margin note"></aside>
    </section>

    <section id="screen-gallery" class="screen" role="tabpanel" aria-labelledby="tab-gallery" tabindex="0" hidden>
      <h2>Leonardo’s Gallery</h2>
      <div id="gallery-grid" class="gallery-grid"></div>
    </section>
  </main>

  <dialog id="settings-modal" class="modal" aria-labelledby="settings-title" hidden>
    <form id="settings-form" class="paper">
      <h2 id="settings-title">Settings</h2>
      <p>
        <label for="settings-provider">Provider</label>
        <select id="settings-provider" name="provider" autofocus>
          <option value="ollama">Ollama</option>
          <option value="gemini">Gemini</option>
        </select>
      </p>
      <p>
        <label for="settings-ollama-url">Ollama URL</label>
        <input id="settings-ollama-url" name="ollamaUrl" type="url" value="http://localhost:11434" required>
      </p>
      <p>
        <label for="settings-ollama-model">Ollama model</label>
        <input id="settings-ollama-model" name="ollamaModel" type="text" value="qwen3-vl:8b" required>
      </p>
      <p>
        <label for="settings-gemini-key">Gemini API key (optional)</label>
        <input id="settings-gemini-key" name="geminiApiKey" type="password" autocomplete="off">
      </p>
      <p>
        <label for="settings-gemini-model">Gemini model name</label>
        <input id="settings-gemini-model" name="geminiModel" type="text">
      </p>
      <button id="settings-save" class="btn btn-primary" type="button">Save</button>
      <button id="settings-close" class="btn btn-ghost" type="button">Close</button>
    </form>
  </dialog>

  <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span class="quill" aria-hidden="true">✒</span>
    <span id="loading-text" class="loading-text"></span>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
</body>
</html>
