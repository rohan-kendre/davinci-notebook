<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Da Vinci's Notebook — physics test</title>
  <style>
    body { margin: 0; padding: 24px; background: #f1e6cc; color: #3b2a1a; font: 17px Georgia, serif; }
    main { max-width: 1100px; margin: auto; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    canvas { display: block; width: 100%; max-width: 1000px; height: auto; background: #fbf5e6; border: 2px solid #8b3e1c; touch-action: none; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 16px 0; }
    button { padding: 8px 16px; border: 1px solid #8b3e1c; background: #fbf5e6; color: #3b2a1a; cursor: pointer; font: inherit; }
    input { vertical-align: middle; }
    #stats { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 12px; }
  </style>
</head>
<body>
<main>
  <h1>Physics test bench</h1>
  <p>Drop the stone box onto the seesaw, then drag any moving part. The rubber ball on the left is tracked.</p>
  <canvas id="sim-canvas" width="1000" height="625"></canvas>
  <div class="controls">
    <button id="play" type="button">Pause</button>
    <button id="reset" type="button">Reset</button>
    <label>Gravity <input id="gravity" type="range" min="0" max="2" step="0.1" value="1"> <span id="gravity-value">1.0</span></label>
  </div>
  <div id="stats" aria-live="off">
    <span>Distance: <strong id="distance">0.00</strong> m</span>
    <span>Peak: <strong id="peak">0.00</strong> m</span>
    <span>Top speed: <strong id="top-speed">0.00</strong> m/s</span>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script type="module">
  import { createSim } from './js/physics.js';

  const scene = {
    title: 'Seesaw, pendulum and motor test',
    bodies: [
      { id: 'ground', label: 'Ground plank', shape: 'rect', x: 500, y: 598,
        width: 1000, height: 22, material: 'earth', static: true },
      { id: 'fulcrum', label: 'Fulcrum', shape: 'polygon',
        vertices: [[455, 565], [545, 565], [500, 480]], material: 'stone', static: true },
      { id: 'seesaw', label: 'Seesaw', shape: 'rect', x: 500, y: 468,
        width: 500, height: 18, material: 'wood', static: false },
      { id: 'ball', label: 'Projectile', shape: 'circle', x: 310, y: 438,
        radius: 20, material: 'rubber', static: false, projectile: true },
      { id: 'box', label: 'Stone box', shape: 'rect', x: 690, y: 270,
        width: 60, height: 60, material: 'stone', static: false, mass: 20 },
      { id: 'pendulum', label: 'Pendulum', shape: 'circle', x: 205, y: 230,
        radius: 27, material: 'stone', static: false },
      { id: 'wheel', label: 'Motor wheel', shape: 'circle', x: 835, y: 150,
        radius: 45, material: 'metal', static: false },
    ],
    joints: [
      { type: 'hinge', a: 'seesaw', b: 'fulcrum', x: 500, y: 468 },
      { type: 'rope', a: 'pendulum', b: null, ax: 205, ay: 230, bx: 140, by: 90 },
      { type: 'hinge', a: 'wheel', b: null, x: 835, y: 150 },
    ],
    motors: [{ body: 'wheel', speed: 2 }],
    velocities: [],
    note: 'Test every supported motion in one scene.',
  };

  const canvas = document.getElementById('sim-canvas');
  const ctx = canvas.getContext('2d');
  const sim = createSim(scene);
  sim.attachMouse(canvas);
  let playing = true;

  const colors = {
    wood: '#a46a3b', stone: '#76685b', metal: '#747f87',
    rubber: '#bd6b46', earth: '#8c744e', cloth: '#b9a58b',
  };
  const worldPoint = (body, point) => body
    ? { x: body.position.x + point.x, y: body.position.y + point.y }
    : point;

  function draw() {
    ctx.fillStyle = '#fbf5e6';
    ctx.fillRect(0, 0, 1000, 625);
    ctx.strokeStyle = '#8b3e1c';
    ctx.lineWidth = 2;
    for (const joint of sim.joints) {
      for (const constraint of joint.constraints) {
        const a = worldPoint(constraint.bodyA, constraint.pointA);
        const b = worldPoint(constraint.bodyB, constraint.pointB);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#8b3e1c';
        ctx.fill();
      }
    }
    for (const body of sim.bodies) {
      ctx.beginPath();
      body.vertices.forEach((vertex, index) => {
        if (index === 0) ctx.moveTo(vertex.x, vertex.y);
        else ctx.lineTo(vertex.x, vertex.y);
      });
      ctx.closePath();
      ctx.fillStyle = colors[body.dv.material] || colors.wood;
      ctx.fill();
      ctx.strokeStyle = '#3b2a1a';
      ctx.stroke();
      if (body.dv.id === 'wheel') {
        ctx.beginPath();
        ctx.moveTo(body.position.x, body.position.y);
        ctx.lineTo(body.vertices[0].x, body.vertices[0].y);
        ctx.stroke();
      }
    }
    ctx.beginPath();
    ctx.moveTo(0, 625);
    ctx.lineTo(1000, 625);
    ctx.strokeStyle = '#8b3e1c';
    ctx.stroke();
    const stats = sim.getStats();
    document.getElementById('distance').textContent = stats.distance.toFixed(2);
    document.getElementById('peak').textContent = stats.peak.toFixed(2);
    document.getElementById('top-speed').textContent = stats.topSpeed.toFixed(2);
  }

  function frame() {
    if (playing) sim.step();
    draw();
    requestAnimationFrame(frame);
  }
  document.getElementById('play').addEventListener('click', event => {
    playing = !playing;
    event.currentTarget.textContent = playing ? 'Pause' : 'Play';
  });
  document.getElementById('reset').addEventListener('click', () => sim.reset());
  document.getElementById('gravity').addEventListener('input', event => {
    const value = Number(event.target.value);
    sim.setGravity(value);
    document.getElementById('gravity-value').textContent = value.toFixed(1);
  });
  frame();
</script>
</body>
</html>
